<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>preview</title>
<style>
html,body{margin:0}
body{padding:16px;box-sizing:border-box;min-height:100vh}
.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.cap{font:500 12px/16px var(--font-sans);color:var(--parchment-muted);margin-top:6px;text-align:center}

</style></head>
<body class="es-root">
<div class="row">
 <div><button class="es-btn" style="width:120px"><svg class="es-btn__icon" width="22" height="14" viewBox="0 0 22 14" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="7" cy="7" r="5"/><circle cx="15" cy="7" r="5"/></svg><span>Fuse</span></button><div class="cap">stone</div></div>
 <div><button class="es-btn" style="width:120px"><svg class="es-btn__icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"><path d="M3 15V8h9M9 4.5 12.5 8 9 11.5"/></svg><span>Divert · <span class="es-btn__count">2</span></span></button><div class="cap">stone + count</div></div>
 <div><button class="es-btn is-pressed" style="width:120px"><svg class="es-btn__icon" width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"><path d="M3 15V8h9M9 4.5 12.5 8 9 11.5"/></svg><span>Divert · <span class="es-btn__count">2</span></span></button><div class="cap">pressed</div></div>
 <div><button class="es-btn es-btn--primary" style="width:200px">Play</button><div class="cap">brass primary</div></div>
 <div><button class="es-btn" disabled style="width:200px">Confirm 3/4</button><div class="cap">disabled</div></div>
</div>
</body>
</html>
