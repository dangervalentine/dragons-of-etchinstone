<!-- @dsCard group="Surfaces" height=330 subtitle="Etched stone panel, Result contents" -->
<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>preview</title>
<style>
html,body{margin:0}
body{padding:16px;box-sizing:border-box;min-height:100vh}
.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.cap{font:500 12px/16px var(--font-sans);color:var(--parchment-muted);margin-top:6px;text-align:center}

</style></head>
<body class="es-root">
<div class="es-panel" style="width:300px">
 <div class="es-panel__head"><span class="es-glyph">&#9670;</span>Result · Lionel Archer</div>
 <div style="display:grid;grid-template-columns:repeat(5,auto);justify-content:space-between;align-items:end;text-align:center;row-gap:2px">
  <span class="es-num" style="font-size:20px">8</span><span class="es-num" style="font-size:20px">+2</span><span class="es-num" style="font-size:20px;color:var(--danger)">−1</span><span class="es-num" style="font-size:20px;color:var(--parchment-muted)">=</span><span class="es-num" style="font-size:20px;color:var(--brass-bright)">9</span>
  <span class="cap" style="margin:0">Spell</span><span class="cap" style="margin:0">Boost</span><span class="cap" style="margin:0">Armor</span><span></span><span class="cap" style="margin:0">Attack</span>
 </div>
 <div style="border-top:1px solid var(--line);margin:12px 0;"></div>
 <div style="display:flex;justify-content:space-between;align-items:center">
  <span style="color:var(--jade);font-weight:800">&#10003; You strike first</span>
  <span class="es-chip es-chip--harm"><span class="es-chip__icon">HP</span>−2</span>
 </div>
 <p style="margin:12px 0 0;font-size:13px;line-height:18px;color:var(--parchment-muted)">9 Attack against 11 HP: the Archer survives and strikes back.</p>
</div>
</body>
</html>
