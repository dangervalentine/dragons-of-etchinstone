<!doctype html>
<html lang="en">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>preview</title>
<style>
html,body{margin:0}
body{padding:16px;box-sizing:border-box;min-height:100vh}
.row{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap}
.cap{font:500 12px/16px var(--font-sans);color:var(--parchment-muted);margin-top:6px;text-align:center}

</style></head>
<body class="es-root">
<div style="display:grid;grid-template-columns:repeat(4,var(--card-width));gap:8px">
 <div class="es-slothead is-filled"><span class="es-slothead__glyph"></span>Reserve</div>
 <div class="es-slothead is-target"><span class="es-slothead__glyph"></span>Element</div>
 <div class="es-slothead"><span class="es-slothead__glyph"></span>Spell</div>
 <div class="es-slothead"><span class="es-slothead__glyph"></span>Boost</div>
 <div class="es-card" data-ether="cinnabar"><div class="es-card__name"><span class="es-card__lvl">2</span>Adapt</div><div class="es-card__ribbon"><span>3</span><span class="xp">3</span></div><div class="es-card__field"><span class="es-plate">3</span><span class="es-plate">3</span><span class="es-plate is-hi">5</span></div></div>
 <div class="es-slot is-target">Element</div>
 <div class="es-slot">Spell</div>
 <div class="es-slot">Boost</div>
</div>
</body>
</html>
